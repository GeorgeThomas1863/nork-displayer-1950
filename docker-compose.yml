name: nork

services:
  displayer:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DISPLAY_PORT}:${DISPLAY_PORT}"
    env_file:
      - path: .env
      - path: .env.local
        required: false
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongo:27017
      SCRAPER_HOST: scraper
      PIC_PATH: /data/pics
      WATCH_PATH: /data/watch
    depends_on:
      mongo:
        condition: service_healthy
      scraper:
        condition: service_started
    volumes:
      - pics:/data/pics:ro
      - watch:/data/watch:ro

  scraper:
    build: ../scraper
    restart: unless-stopped
    env_file:
      - path: ../scraper/.env
      - path: ../scraper/.env.local
        required: false
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongo:27017
      PIC_PATH: /data/pics
      WATCH_PATH: /data/watch
      WATCH_PROFILE_PATH: /data/watch-profile
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - pics:/data/pics
      - watch:/data/watch
      - watch-profile:/data/watch-profile

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pics:
  mongo-data:
  watch:
  watch-profile:
